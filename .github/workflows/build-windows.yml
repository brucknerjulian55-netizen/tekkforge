name: Windows VST3 bauen
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Einrichten
        run: cmake -B build -A x64
      - name: Bauen
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: Tekkforge-VST3
          path: build/Tekkforge_artefacts/Release/VST3/
      - name: ZIP packen
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path build/Tekkforge_artefacts/Release/VST3/* -DestinationPath Tekkforge-VST3.zip
      - name: Veroeffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Tekkforge-VST3.zip
          generate_release_notes: true
